# EventFlow - Production Profile
# Used for production deployments with Kubernetes

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL}

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    ssl: true

  graphql:
    graphiql:
      enabled: false

logging:
  level:
    com.eventflow: WARN

eventflow:
  retry:
    max-attempts: 5
    base-delay-ms: 60000
    multiplier: 5
    jitter-percentage: 0.20
  dlq:
    retention-days: 30

management:
  tracing:
    sampling:
      probability: 0.1