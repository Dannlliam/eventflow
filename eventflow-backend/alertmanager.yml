# EventFlow Alertmanager Configuration
# Handles alerts from Prometheus and routes to appropriate receivers
# As specified in PRD Section 62 - Observability / Alerting

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty'
      repeat_interval: 10m
    - match:
        severity: warning
      receiver: 'slack'
      repeat_interval: 2h
    - match:
        severity: info
      receiver: 'email'
      repeat_interval: 24h

receivers:
  - name: 'default'
    slack_configs:
      - channel: '#eventflow-alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: 'pagerduty'
    pagerduty_configs:
      - routing_key: ${PAGERDUTY_ROUTING_KEY}
        severity: 'critical'

  - name: 'slack'
    slack_configs:
      - channel: '#eventflow-alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .GroupLabels.severity }}
          *Service:* {{ .GroupLabels.service }}
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* {{ .CommonAnnotations.runbook_url }}
        actions:
          - type: button
            text: 'View Dashboard'
            url: 'https://grafana.eventflow.com'

  - name: 'email'
    email_configs:
      - to: 'ops@eventflow.com'
        from: 'alerts@eventflow.com'
        smarthost: 'smtp.sendgrid.net:587'
        auth_username: 'apikey'
        auth_password: ${SMTP_PASSWORD}
        headers:
          subject: '[EventFlow] {{ .GroupLabels.alertname }}'

global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL}
  pagerduty_url: https://events.pagerduty.com/v2/enqueue