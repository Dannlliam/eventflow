version: '3.8'

# EventFlow Local Development Infrastructure
# Run: docker-compose up -d
# Full stack: docker-compose --profile full up -d

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: eventflow-postgres
    profiles: ["infra", "full"]
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: |
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    networks:
      - eventflow-network

  # ============================================================
  # Redis Cache & Rate Limiting
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: eventflow-redis
    profiles: ["infra", "full"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - eventflow-network

  # ============================================================
  # Apache Kafka (KRaft mode - no Zookeeper)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: eventflow-kafka
    profiles: ["infra", "full"]
    depends_on:
      - schema-registry
    ports:
      - "9092:9092"
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLUSTER_ID: "eventflow-cluster-id"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventflow-network

  # ============================================================
  # Schema Registry
  # ============================================================
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.1
    container_name: eventflow-schema-registry
    profiles: ["infra", "full"]
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - eventflow-network

  # ============================================================
  # Redpanda Console (Kafka GUI)
  # ============================================================
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: eventflow-redpanda-console
    profiles: ["infra", "full"]
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_ENABLED: "true"
      SCHEMA_REGISTRY_URLS: http://schema-registry:8081
    networks:
      - eventflow-network

  # ============================================================
  # Observability Stack
  # ============================================================
  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: eventflow-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - eventflow-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: eventflow-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - eventflow-network

  # Loki (Log aggregation)
  loki:
    image: grafana/loki:latest
    container_name: eventflow-loki
    profiles: ["observability"]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - eventflow-network

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: eventflow-otel-collector
    profiles: ["observability"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    command:
      - '--config=/etc/otel-collector-config.yaml'
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - eventflow-network

  # ============================================================
  # EventFlow Backend (Spring Boot)
  # ============================================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: eventflow-backend
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eventflow
      DB_USER: eventflow
      DB_PASSWORD: eventflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      JWT_SECRET: eventflow-local-jwt-secret-key-min-256-bits!
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: eventflow-backend
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0 -XX:+UseZGC -XX:ZCollectionInterval=30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventflow-network

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:

networks:
  eventflow-network:
    driver: bridge